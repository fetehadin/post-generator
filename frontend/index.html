<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Posts for X, LinkedIn and Telegram, written in your own voice."
    />
    <meta property="og:title" content="Voxlace" />
    <meta
      property="og:description"
      content="Posts for X, LinkedIn and Telegram, written in your own voice."
    />
    <meta property="og:image" content="https://voxlace.fetehadin.com/og-image.png?v=2" />
    <meta property="og:url" content="https://voxlace.fetehadin.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Voxlace</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The build writes the logged-out homepage into #root (scripts/prerender.mjs) for
      // visitors without JavaScript. Every other route gets this same file, and a logged-in
      // visitor gets the app at /: empty it there before it paints, so it never flashes.
      ;(function () {
        var root = document.getElementById('root')
        if (!root.querySelector('[data-prerendered="home"]')) return
        var loggedIn = false
        try {
          for (var i = 0; i < localStorage.length; i++)
            if (/^sb-.+-auth-token$/.test(localStorage.key(i) || '')) loggedIn = true
        } catch (e) {}
        if (location.pathname !== '/' || loggedIn) root.textContent = ''
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
