<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voxlace Clickable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a thin "prototype" bar on top; below it either a centered auth card, a setup wizard, or the app shell (sidebar + content). */
:root {
  --ground: #F3F5F8; --surface: #FFFFFF; --ink: #121826; --muted: #4A5468; --line: #D7DDE7; --line-strong: #A9B3C6;
  --blue: #2346D8; --blue-ink: #16309E; --blue-tint: #E6ECFD; --on-blue: #FFFFFF;
  --orange: #B4400B; --orange-ink: #8A2F06; --orange-tint: #FCEBDD;
  --ok: #1E6B43; --ok-tint: #DCEFE3; --warn: #9A3412; --warn-tint: #FDE8DA;
  --side: #121826; --side-ink: #D7DDE7; --soft: #E8ECF3;
  --display: 'Bricolage Grotesque', Georgia, serif; --body: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #0E121C; --surface: #171C28; --ink: #E8ECF4; --muted: #A3ADC2; --line: #2A3243; --line-strong: #46506A;
  --blue: #7D97FF; --blue-ink: #A9BBFF; --blue-tint: #1D2645; --on-blue: #0E121C;
  --orange: #F0915A; --orange-ink: #F6B48C; --orange-tint: #3A2418;
  --ok: #6FD39C; --ok-tint: #16301F; --warn: #F6A97A; --warn-tint: #3A2418;
  --side: #090C14; --side-ink: #C3CBDB; --soft: #222A3A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --ground: #0E121C; --surface: #171C28; --ink: #E8ECF4; --muted: #A3ADC2; --line: #2A3243; --line-strong: #46506A;
  --blue: #7D97FF; --blue-ink: #A9BBFF; --blue-tint: #1D2645; --on-blue: #0E121C;
  --orange: #F0915A; --orange-ink: #F6B48C; --orange-tint: #3A2418;
  --ok: #6FD39C; --ok-tint: #16301F; --warn: #F6A97A; --warn-tint: #3A2418;
  --side: #090C14; --side-ink: #C3CBDB; --soft: #222A3A; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.3px; }
h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.12; }
h2 { font-size: 24px; line-height: 1.2; }
h3 { font-size: 18px; line-height: 1.3; }
p { margin: 0; }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ship { background: var(--orange); border-color: var(--orange); color: var(--on-blue); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; filter: none; }
.btn.full { width: 100%; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .label { font-size: 14px; font-weight: 600; }
.hint { font-size: 13px; color: var(--muted); }
input[type=text], input[type=email], select, textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); }
textarea { resize: vertical; line-height: 1.5; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--soft); }
.chip.blue { background: var(--blue-tint); color: var(--blue-ink); }
.chip.orange { background: var(--orange-tint); color: var(--orange-ink); }
.chip.ok { background: var(--ok-tint); color: var(--ok); }
.chip.warn { background: var(--warn-tint); color: var(--warn); }
.tag { display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px 2px 10px; border-radius: 8px; background: var(--soft); font-size: 14px; }
.tag button { min-width: 32px; min-height: 32px; border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 16px; }
.mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--soft); border-radius: 12px; }
.seg button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

/* Prototype bar (not part of the product) */
.protobar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding-block: 8px; padding-inline: 16px; background: var(--soft); border-bottom: 1px dashed var(--line-strong); font-size: 13px; }
.protobar .row { gap: 6px; }
.protobar .btn { min-height: 34px; padding: 0 10px; font-size: 13px; }
.protobar b { font-weight: 700; }

/* Auth */
.auth-wrap { min-height: calc(100vh - 52px); display: grid; place-items: center; padding-block: 40px; padding-inline: 16px; }
.auth { width: min(440px, 100%); display: flex; flex-direction: column; gap: 18px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -0.5px; }
.google-dot { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(#EA4335 0 25%, #FBBC05 0 50%, #34A853 0 75%, #4285F4 0); }
.error { color: var(--warn); font-size: 14px; font-weight: 600; }
.code-input { letter-spacing: 10px; font-family: var(--mono); font-size: 22px !important; text-align: center; }

/* Welcome */
.welcome { max-width: 1120px; margin: 0 auto; padding-block: 56px; padding-inline: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 48px; align-items: center; }
.welcome h1 { font-size: clamp(36px, 6vw, 60px); }
.lede { font-size: 18px; color: var(--muted); max-width: 52ch; }
.steps3 { display: grid; gap: 10px; }
.steps3 div { display: flex; gap: 12px; align-items: baseline; }
.steps3 b { font-family: var(--display); color: var(--blue); min-width: 20px; }
.preview-post { white-space: pre-line; font-size: 16px; line-height: 1.55; }

/* Setup */
.setup { max-width: 820px; margin: 0 auto; padding-block: 32px 64px; padding-inline: 16px; display: flex; flex-direction: column; gap: 22px; }
.progress { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.progress div { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.progress div::before { content: ""; height: 6px; border-radius: 3px; background: var(--line); }
.progress div.done::before { background: var(--ok); }
.progress div.now { color: var(--ink); }
.progress div.now::before { background: var(--blue); }
@media (max-width: 560px) { .progress div span { display: none; } }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--line-strong); border-radius: 12px; cursor: pointer; }
.check input { width: 22px; height: 22px; margin-top: 2px; flex-shrink: 0; }
.bar { height: 10px; border-radius: 5px; background: var(--soft); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--blue); transition: width 0.2s linear; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick button { min-height: 40px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 14px; }
.pick button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 120px; border: 2px dashed var(--line-strong); border-radius: 12px; text-align: center; padding: 16px; cursor: pointer; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }

/* App shell */
.shell { display: flex; flex-wrap: wrap; min-height: calc(100vh - 52px); }
.side { flex: 1 1 220px; max-width: 100%; background: var(--side); color: var(--side-ink); padding-block: 24px; padding-inline: 16px; display: flex; flex-direction: column; gap: 24px; }
.side .brand { color: #FFFFFF; padding-inline: 12px; }
.side nav { display: flex; flex-direction: column; gap: 4px; }
.side nav a { display: flex; align-items: center; min-height: 44px; padding-inline: 12px; border-radius: 10px; color: var(--side-ink); text-decoration: none; font-weight: 500; }
.side nav a:hover { background: rgba(255,255,255,0.08); }
.side nav a[aria-current="page"] { background: #2346D8; color: #FFFFFF; font-weight: 700; }
.side .usage { margin-top: auto; padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.06); font-size: 13px; }
.content { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding-block: 14px; padding-inline: clamp(16px, 4vw, 40px); border-bottom: 1px solid var(--line); background: var(--surface); position: relative; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--blue); color: var(--on-blue); display: grid; place-items: center; font-weight: 700; border: 0; cursor: pointer; }
.menu { position: absolute; right: clamp(16px, 4vw, 40px); top: 62px; z-index: 5; width: 240px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.18); padding: 8px; display: flex; flex-direction: column; }
.menu a, .menu button { display: flex; align-items: center; min-height: 44px; padding-inline: 12px; border-radius: 8px; border: 0; background: transparent; text-align: left; text-decoration: none; color: var(--ink); cursor: pointer; font-weight: 500; }
.menu a:hover, .menu button:hover { background: var(--soft); }
.page { padding-block: 32px 64px; padding-inline: clamp(16px, 4vw, 40px); display: flex; flex-direction: column; gap: 22px; max-width: 1100px; width: 100%; }
@media (max-width: 760px) {
  .side { flex-basis: 100%; padding-block: 12px; gap: 10px; }
  .side nav { flex-direction: row; overflow-x: auto; }
  .side nav a { white-space: nowrap; }
  .side .usage { display: none; }
}

/* Chat + drafts */
.bubble-me { align-self: flex-end; max-width: 640px; background: var(--blue); color: var(--on-blue); border-radius: 16px 16px 4px 16px; padding: 14px 18px; }
.bubble-app { max-width: 720px; }
.post-text { white-space: pre-line; font-size: 16px; line-height: 1.6; }
.counter { font-variant-numeric: tabular-nums; }
.versions button { display: flex; justify-content: space-between; width: 100%; min-height: 40px; padding-inline: 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; }
.versions button[aria-current="true"] { background: var(--blue-tint); font-weight: 700; }
.example { font-size: 14px; padding: 10px 12px; background: var(--ground); border-radius: 8px; }

/* Calendar */
.cal-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.cal { min-width: 820px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal .head { padding: 10px 12px; font-size: 13px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--line); }
.cal .head.today { background: var(--blue); color: var(--on-blue); }
.cal .day { min-height: 300px; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--line); }
.cal .day:last-child { border-right: 0; }
.ev { display: flex; flex-direction: column; gap: 2px; padding: 10px; border-radius: 10px; font-size: 13px; line-height: 1.35; background: var(--ground); text-decoration: none; color: var(--ink); }
.ev.tg { border: 2px solid var(--blue); background: var(--blue-tint); }
.ev.x { border: 2px solid var(--orange); background: var(--orange-tint); }
.ev.li { border: 1px dashed var(--line-strong); }

/* Profile */
.profile-head { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
.big-avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--blue); color: var(--on-blue); display: grid; place-items: center; font-family: var(--display); font-size: 32px; font-weight: 700; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.kv { display: grid; grid-template-columns: minmax(120px, 180px) minmax(0, 1fr); gap: 8px 16px; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; white-space: pre-line; }

/* How it works */
.how { max-width: 1180px; margin: 0 auto; padding-block: 32px 64px; padding-inline: 16px; display: flex; flex-direction: column; gap: 22px; }
.lane { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.step { flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 14px; border-radius: 12px; border: 2px solid var(--line-strong); background: var(--surface); cursor: pointer; }
.step:hover { transform: translateY(-1px); }
.step.F { border-color: var(--blue); background: var(--blue-tint); }
.step.N { border-color: var(--orange); background: var(--orange-tint); }
.step.B { border-color: var(--ink); }
.step[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--ink); }
.step .n { font-size: 12px; font-weight: 700; color: var(--muted); }
.step .t { font-weight: 700; font-size: 16px; }
.step .o { font-size: 12px; font-weight: 700; margin-top: auto; }
.arrow { align-self: center; color: var(--muted); font-size: 18px; }
@media (max-width: 760px) { .arrow { display: none; } }
.detail { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 18px; }
.detail dl { margin: 0; display: grid; gap: 4px; }
.detail dt { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); }
.detail dd { margin: 0 0 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; max-width: min(520px, calc(100% - 32px)); background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: 12px; font-weight: 600; box-shadow: 0 12px 32px rgba(0,0,0,0.25); }
</style>
</head>
<body>

<div class="protobar" role="region" aria-label="Prototype controls">
  <div><b>Voxlace prototype</b> · a clickable sketch for the team, not the real app. Nothing is sent anywhere.</div>
  <div class="row">
    <a class="btn" href="#how">How it works</a>
    <button class="btn" type="button" data-action="reopen">Close &amp; reopen app</button>
    <button class="btn" type="button" data-action="reset">Start as a new visitor</button>
  </div>
</div>
<div id="view"></div>
<div id="toast" class="toast" hidden></div>

      else { im.pct = Math.min(100, im.pct + 12); var done = Math.round((im.pct - 42) / 58 * 415); im.label = "Learning your voice…"; im.sub = "Embedded " + Math.max(0, Math.min(415, done)) + " of 415 posts"; }
      if (im.pct >= 100) { clearInterval(importTimer); S.ui.importing = null; S.account.imported = true; save(); toast("415 Telegram posts learned."); }

    else if (a === "open-draft") { S.draft = null; ensureDraft(b.getAttribute("data-platform")); save(); go("draft"); }
    else if (a === "platform") { S.draft = null; ensureDraft(b.getAttribute("data-platform")); S.ui.prompt = false; save(); render(); }
    else if (a === "revise") { d = ensureDraft(); var kind = b.getAttribute("data-kind"); d.versions.push({ label: '"' + b.textContent.toLowerCase() + '"', text: REVISE[kind][d.platform] }); d.cur = d.versions.length - 1; save(); render(); toast("New version made. The old one is still in Versions."); }
    else if (a === "version") { d = ensureDraft(); d.cur = +b.getAttribute("data-i"); save(); render(); }
    else if (a === "prompt") { S.ui.prompt = !S.ui.prompt; render(); }
    else if (a === "approve-send") {
      d = ensureDraft(); d.status = d.platform === "telegram" ? "Published" : "Approved"; save(); render();
      if (d.platform === "telegram") toast("Approved and sent to FeteScript by the bot (simulated).");
      else if (d.platform === "x") toast("Approved. The real app opens x.com with this text pre-filled; you press Post.");
      else { var txt = d.versions[d.cur].text; try { navigator.clipboard.writeText(txt).then(function () { toast("Copied. The real app now opens LinkedIn's composer; paste and post."); }, function () { toast("Approved. The real app copies the text and opens LinkedIn."); }); } catch (x) { toast("Approved. The real app copies the text and opens LinkedIn."); } }
    }
    else if (a === "approve-schedule") { d = ensureDraft(); d.status = "Approved"; d.scheduled = "Thu 16 Oct, 18:00"; save(); go("calendar"); toast("Approved and scheduled for 18:00 today."); }
    else if (a === "edit") { S.ui.editing = b.getAttribute("data-section"); render(); var f = document.querySelector('[data-form="section"] input, [data-form="section"] textarea'); if (f) f.focus(); }
    else if (a === "cancel-edit") { S.ui.editing = null; render(); }
    else if (a === "tab") { S.ui.tab = b.getAttribute("data-tab"); S.ui.confirmDelete = false; render(); }
    else if (a === "export") toast("The real app prepares a JSON file of all your data here.");
    else if (a === "delete-ask") { S.ui.confirmDelete = true; render(); }
    else if (a === "delete-no") { S.ui.confirmDelete = false; render(); }
    else if (a === "delete-yes") { try { localStorage.removeItem(KEY); } catch (x) {} S = fresh(); go("welcome"); toast("Account and all its data deleted."); }
    else if (a === "lane") { S.howLane = b.getAttribute("data-lane"); S.howStep = 0; save(); render(); }
    else if (a === "step") { S.howStep = +b.getAttribute("data-i"); save(); render(); var c = document.querySelector(".how .card h2"); if (c && window.innerWidth < 760) c.scrollIntoView({ block: "start" }); }
    else if (a === "prev-step") { S.howStep = Math.max(0, S.howStep - 1); save(); render(); }
    else if (a === "next-step") { S.howStep = S.howStep + 1; save(); render(); }
  });

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.getAttribute("data-action") === "tg-file" && t.files && t.files.length) { toast("Got " + t.files[0].name + ". The prototype simulates the import; nothing is uploaded."); runImport(); }
    else if (t.getAttribute("data-action") === "later-file" && t.files && t.files.length) toast("Got " + t.files[0].name + ". X and LinkedIn import arrive in Phase 3.");
    else if (t.tagName === "SELECT" && t.getAttribute("data-bind")) bind(t);
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.getAttribute("data-bind")) bind(t);
    if (t.id === "checkin") S.ui.checkin = t.value;
    if (t.getAttribute("data-action") === "draft-input") {
      var d = ensureDraft(); setDraftText(t.value);
      var n = count(d.platform, t.value), lim = LIMITS[d.platform], over = n > lim, c = document.getElementById("counter");
      c.textContent = n.toLocaleString() + " / " + lim.toLocaleString(); c.className = "chip counter " + (over ? "warn" : "ok");
      document.getElementById("over-note").hidden = !over;
      document.querySelectorAll('[data-action="approve-send"],[data-action="approve-schedule"]').forEach(function (b) { b.disabled = over; });
    }
  });
  function bind(t) {
    var k = t.getAttribute("data-bind");
    if (k === "summary") S.account.summary = t.value; else if (k.indexOf("p.") === 0) { S.account.profile[k.slice(2)] = t.value; S.account.summary = ""; }
    save();
  }

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, kind = f.getAttribute("data-form");
    if (kind === "signup" || kind === "login") authSubmit(kind);
    else if (kind === "verify") {
      var code = (document.getElementById("code").value || "").replace(/\D/g, "");
      if (code.length !== 6) { S.ui.codeError = "The code has 6 digits. Check your email and try again."; render(); return; }
      startSession(S.pending.email, S.pending.mode);
    }
    else if (kind === "addtag") {
      var v = (document.getElementById("newtag").value || "").trim(); if (!v) return;
      if (v[0] !== "#") v = "#" + v; v = v.replace(/\s+/g, "");
      if (S.account.excluded.map(function (x) { return x.toLowerCase(); }).indexOf(v.toLowerCase()) < 0) S.account.excluded.push(v);
      save(); render(); toast("Posts tagged " + v + " won't be used to learn your voice.");
    }
    else if (kind === "checkin") {
      var ta = document.getElementById("checkin"), text = (ta.value || "").trim(), p = (e.submitter && e.submitter.getAttribute("data-platform")) || "telegram";
      if (text) S.chat.push({ kind: "checkin", text: text });
      S.chat.push({ kind: "draft", platform: p, text: DRAFTS[p] }); S.ui.checkin = ""; save(); render();
      toast(PNAME[p] + " draft ready. (The prototype shows a sample draft.)");
    }
    else if (kind === "revise") {
      var inp = document.getElementById("revise-text"), ins = (inp.value || "").trim(); if (!ins) return;
      var d = ensureDraft(); d.versions.push({ label: '"' + ins.slice(0, 30) + '"', text: REVISE.punchier[d.platform] }); d.cur = d.versions.length - 1; save(); render(); toast("New version made from your instruction (sample text in the prototype).");
    }
    else if (kind === "section") {
      var P = S.account.profile; Array.prototype.forEach.call(f.querySelectorAll("input,textarea"), function (x) { P[x.name] = x.value; });
      S.account.summary = ""; S.ui.editing = null; save(); render(); toast("Saved. Your summary card was refreshed, and the next drafts will use it.");
    }
  });

  window.addEventListener("hashchange", function () { S.ui.menu = false; if (S.ui.authError && !isAuth(route())) S.ui.authError = ""; render(); });
  boot(true);
})();
</script>
</body>
</html>
