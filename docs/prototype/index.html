<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voxlace Clickable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: thin prototype bar; then either a woven-pattern auth/welcome canvas, an 8-step setup, or the app shell (dark sidebar + workspace). */
:root {
  --bg: #F4F5F9; --panel: #FFFFFF; --panel-2: #EEF0F6; --ink: #0F1422; --ink-2: #333B4F; --muted: #566077; --line: #DCE0EA; --line-2: #B3BCCF;
  --accent: #3355FF; --accent-ink: #1C34B8; --accent-tint: #E5EAFF; --on-accent: #FFFFFF;
  --amber: #F2A33A; --amber-tint: #FDF0DC; --amber-ink: #6E4205;
  --ok: #13703F; --ok-tint: #DDF3E6; --warn: #A93A08; --warn-tint: #FCE9DC;
  --side: #0F1422; --side-2: #1B2234; --side-ink: #C5CCDD; --side-muted: #8C95AB;
  --tg: #0F6E9E; --tg-tint: #E1F2FC; --li: #0A5BAD; --li-tint: #E3EEF9; --xk: #0F1422; --x-tint: #E9ECF2;
  --weave-a: rgba(51, 85, 255, 0.10); --weave-b: rgba(242, 163, 58, 0.14);
  --shadow: 0 1px 2px rgba(15, 20, 34, 0.06), 0 8px 24px rgba(15, 20, 34, 0.06);
  --display: 'Bricolage Grotesque', Georgia, serif; --body: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B0F19; --panel: #131A28; --panel-2: #1A2336; --ink: #E9EDF6; --ink-2: #C6CDDC; --muted: #9AA4BA; --line: #263049; --line-2: #3B4767;
  --accent: #7D95FF; --accent-ink: #B4C2FF; --accent-tint: #1E2A55; --on-accent: #0B0F19;
  --amber: #F2B356; --amber-tint: #3A2A12; --amber-ink: #F6D29A;
  --ok: #62D59D; --ok-tint: #12301F; --warn: #F5A77B; --warn-tint: #3A2216;
  --side: #070A12; --side-2: #141B2B; --side-ink: #BCC4D7; --side-muted: #7F89A0;
  --tg: #6CC6F2; --tg-tint: #0F2738; --li: #79B0EC; --li-tint: #112236; --xk: #E9EDF6; --x-tint: #1F273A;
  --weave-a: rgba(125, 149, 255, 0.10); --weave-b: rgba(242, 179, 86, 0.10);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B0F19; --panel: #131A28; --panel-2: #1A2336; --ink: #E9EDF6; --ink-2: #C6CDDC; --muted: #9AA4BA; --line: #263049; --line-2: #3B4767;
  --accent: #7D95FF; --accent-ink: #B4C2FF; --accent-tint: #1E2A55; --on-accent: #0B0F19;
  --amber: #F2B356; --amber-tint: #3A2A12; --amber-ink: #F6D29A;
  --ok: #62D59D; --ok-tint: #12301F; --warn: #F5A77B; --warn-tint: #3A2216;
  --side: #070A12; --side-2: #141B2B; --side-ink: #BCC4D7; --side-muted: #7F89A0;
  --tg: #6CC6F2; --tg-tint: #0F2738; --li: #79B0EC; --li-tint: #112236; --xk: #E9EDF6; --x-tint: #1F273A;
  --weave-a: rgba(125, 149, 255, 0.10); --weave-b: rgba(242, 179, 86, 0.10);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--display); margin: 0; letter-spacing: -0.4px; text-wrap: balance; color: var(--ink); }
h1 { font-size: clamp(28px, 3.4vw, 38px); line-height: 1.1; font-weight: 750; }
h2 { font-size: 22px; line-height: 1.2; font-weight: 700; }
h3 { font-size: 17px; line-height: 1.3; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card.tint { background: var(--panel-2); box-shadow: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .08s ease, border-color .15s ease, background .15s ease; }
.btn:hover { border-color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.amber { background: var(--amber); border-color: var(--amber); color: #2A1A02; }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn.full { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650; background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.chip.accent { background: var(--accent-tint); color: var(--accent-ink); }
.chip.amber { background: var(--amber-tint); color: var(--amber-ink); }
.chip.ok { background: var(--ok-tint); color: var(--ok); }
.chip.warn { background: var(--warn-tint); color: var(--warn); }
.chip.tg { background: var(--tg-tint); color: var(--tg); }
.chip.li { background: var(--li-tint); color: var(--li); }
.chip.x { background: var(--x-tint); color: var(--xk); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: currentColor; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: 13px; font-weight: 650; color: var(--ink-2); }
.hint { font-size: 12.5px; color: var(--muted); }
input[type=text], input[type=email], input[type=time], select, textarea { width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); }
textarea { resize: vertical; line-height: 1.55; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; background: var(--panel-2); border-radius: 12px; }
.seg button { min-height: 34px; padding: 0 13px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; font-weight: 650; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick button { min-height: 36px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--panel); cursor: pointer; font-size: 13px; font-weight: 600; }
.pick button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.switch { position: relative; width: 44px; height: 26px; border-radius: 13px; border: 0; background: var(--line-2); cursor: pointer; flex-shrink: 0; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { left: 21px; }
.tag { display: inline-flex; align-items: center; gap: 2px; padding: 2px 3px 2px 10px; border-radius: 8px; background: var(--panel-2); font-size: 13px; font-weight: 600; }
.tag button { min-width: 28px; min-height: 28px; border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 15px; border-radius: 6px; }
.tag button:hover { background: var(--line); color: var(--ink); }
.error { color: var(--warn); font-size: 13px; font-weight: 650; }
.bar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); transition: width .25s linear; }

/* Prototype bar */
.protobar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; padding-block: 7px; padding-inline: 16px; background: var(--amber-tint); color: var(--amber-ink); font-size: 12.5px; border-bottom: 1px solid var(--line); }
.protobar .btn { min-height: 30px; padding: 0 10px; font-size: 12px; background: transparent; border-color: var(--amber-ink); color: var(--amber-ink); }

/* Welcome + auth */
.weave { background-color: var(--bg); background-image: repeating-linear-gradient(115deg, transparent 0 26px, var(--weave-a) 26px 28px), repeating-linear-gradient(25deg, transparent 0 34px, var(--weave-b) 34px 36px); }
.hero { max-width: 1160px; margin: 0 auto; padding-block: clamp(36px, 7vw, 84px) 56px; padding-inline: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr)); gap: 48px; align-items: center; }
.brand { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -0.6px; display: inline-flex; align-items: center; gap: 10px; }
.mark { width: 30px; height: 30px; border-radius: 9px; background: conic-gradient(from 210deg, var(--accent), var(--amber), var(--accent)); display: inline-block; position: relative; }
.mark::after { content: ""; position: absolute; inset: 7px; border-radius: 4px; background: var(--bg); }
.hero h1 { font-size: clamp(40px, 6.2vw, 68px); line-height: 1.02; letter-spacing: -1.6px; }
.hero h1 em { font-style: normal; color: var(--accent); }
.lede { font-size: 18px; color: var(--ink-2); max-width: 54ch; }
.feature-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px; }
.feature { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.feature b { display: block; font-family: var(--display); font-size: 16px; margin-bottom: 2px; }
.auth-wrap { min-height: calc(100vh - 46px); display: grid; place-items: center; padding-block: 40px; padding-inline: 16px; }
.auth { width: min(440px, 100%); display: flex; flex-direction: column; gap: 16px; padding: 30px; }
.gdot { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(#EA4335 0 25%, #FBBC05 0 50%, #34A853 0 75%, #4285F4 0); }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.code-input { letter-spacing: 12px; font-family: var(--mono); font-size: 24px !important; text-align: center; }

/* Setup */
.setup { max-width: 860px; margin: 0 auto; padding-block: 28px 64px; padding-inline: 16px; display: flex; flex-direction: column; gap: 22px; }
.progress { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; }
.progress div { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; font-weight: 650; color: var(--muted); min-width: 0; }
.progress div span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress div::before { content: ""; height: 5px; border-radius: 3px; background: var(--line); }
.progress .done::before { background: var(--ok); }
.progress .now { color: var(--ink); }
.progress .now::before { background: var(--accent); }
@media (max-width: 640px) { .progress div span { display: none; } }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--line-2); border-radius: 12px; cursor: pointer; background: var(--panel); }
.check input { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; accent-color: var(--accent); }
.drop { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 116px; border: 2px dashed var(--line-2); border-radius: 12px; text-align: center; padding: 14px; cursor: pointer; background: var(--panel-2); }
.drop:hover { border-color: var(--accent); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }

/* App shell */
.shell { display: flex; flex-wrap: wrap; min-height: calc(100vh - 46px); }
.side { flex: 0 1 236px; max-width: 100%; background: var(--side); color: var(--side-ink); padding-block: 22px; padding-inline: 14px; display: flex; flex-direction: column; gap: 22px; }
.side .brand { color: #F2F4FA; padding-inline: 10px; }
.side .brand .mark::after { background: var(--side); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .sec { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--side-muted); padding: 14px 12px 6px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding-inline: 12px; border-radius: 10px; color: var(--side-ink); text-decoration: none; font-weight: 550; font-size: 14px; }
.nav a:hover { background: var(--side-2); color: #FFFFFF; }
.nav a[aria-current="page"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.nav .badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--amber); color: #2A1A02; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--side-2); font-size: 12.5px; }
.side-foot .bar { background: rgba(255,255,255,.12); }
.side-foot .bar span { background: var(--amber); }
.main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; padding-inline: clamp(16px, 3vw, 32px); background: var(--panel); border-bottom: 1px solid var(--line); }
.topbar .crumb { font-weight: 650; font-size: 14px; color: var(--muted); }
.iconbtn { position: relative; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: grid; place-items: center; color: var(--ink-2); }
.iconbtn .pip { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--amber)); color: #FFFFFF; display: grid; place-items: center; font-weight: 750; border: 0; cursor: pointer; font-size: 14px; }
.pop { position: absolute; right: clamp(16px, 3vw, 32px); top: 60px; z-index: 30; width: min(320px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.2); padding: 8px; display: flex; flex-direction: column; }
.pop a, .pop button.item { display: flex; align-items: center; gap: 10px; min-height: 42px; padding-inline: 12px; border-radius: 9px; border: 0; background: transparent; text-align: left; text-decoration: none; color: var(--ink); cursor: pointer; font-weight: 550; font-size: 14px; }
.pop a:hover, .pop button.item:hover { background: var(--panel-2); }
.pop .note { padding: 10px 12px; border-radius: 9px; font-size: 13px; }
.pop .note + .note { border-top: 1px solid var(--line); }
.page { padding-block: 26px 64px; padding-inline: clamp(16px, 3vw, 32px); display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 1240px; }
.page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
@media (max-width: 860px) {
  .side { flex-basis: 100%; padding-block: 10px; gap: 8px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; }
  .nav .sec, .side-foot { display: none; }
  .nav a { white-space: nowrap; }
}

/* Feed */
.feed { display: flex; flex-direction: column; gap: 14px; }
.daysep { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; }
.daysep::before, .daysep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.me { align-self: flex-end; max-width: min(640px, 92%); background: var(--accent); color: var(--on-accent); border-radius: 18px 18px 4px 18px; padding: 12px 16px; }
.me .eyebrow { color: inherit; opacity: .8; }
.bot-line { align-self: flex-start; max-width: min(640px, 92%); background: var(--panel-2); border-radius: 18px 18px 18px 4px; padding: 12px 16px; font-size: 14px; }
.post { white-space: pre-line; font-size: 15.5px; line-height: 1.6; overflow-wrap: anywhere; }
.counter { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.composer { position: sticky; bottom: 12px; }

/* Studio */
.studio { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1080px) { .studio { grid-template-columns: minmax(0, 1fr); } }
.editor textarea { min-height: 220px; font-size: 16px; line-height: 1.6; border-radius: 12px; padding: 14px; }
.insp { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; background: var(--panel-2); }
.insp select { width: auto; min-height: 34px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
.chat { display: flex; flex-direction: column; height: min(640px, 78vh); padding: 0; overflow: hidden; }
.chat-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.chat-log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 10px 13px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px; }
.msg .vtag { display: inline-block; margin-top: 6px; font-family: var(--mono); font-size: 11px; font-weight: 600; opacity: .8; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { min-height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-size: 12.5px; font-weight: 600; }
.chips button:hover { border-color: var(--accent); color: var(--accent-ink); }
.chat-foot { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.selnote { font-size: 12px; padding: 6px 10px; border-radius: 8px; background: var(--amber-tint); color: var(--amber-ink); }
.versions button { display: flex; justify-content: space-between; gap: 8px; width: 100%; min-height: 38px; padding-inline: 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; font-size: 13px; }
.versions button:hover { background: var(--panel-2); }
.versions button[aria-current="true"] { background: var(--accent-tint); color: var(--accent-ink); font-weight: 700; }
.example { font-size: 13px; padding: 9px 11px; background: var(--panel-2); border-radius: 9px; }
.sched { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 12px; border: 1px dashed var(--line-2); border-radius: 12px; }
.sched select, .sched input { width: auto; min-height: 36px; }

/* Library */
.dlist { display: flex; flex-direction: column; gap: 10px; }
.ditem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--ink); }
.ditem:hover { border-color: var(--accent); }
.ditem .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Calendar */
.cal-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); }
.cal { min-width: 860px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal .head { padding: 10px 12px; font-size: 12.5px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
.cal .head.today { background: var(--accent); color: var(--on-accent); }
.cal .day { min-height: 340px; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--line); transition: background .12s; }
.cal .head:nth-child(7), .cal .day:nth-child(14) { border-right: 0; }
.cal .day.over { background: var(--accent-tint); }
.cal .day.today { background: color-mix(in srgb, var(--accent-tint) 45%, transparent); }
.ev { display: flex; flex-direction: column; gap: 3px; padding: 9px 10px; border-radius: 10px; font-size: 12.5px; line-height: 1.35; background: var(--panel-2); color: var(--ink); border-left: 4px solid var(--line-2); }
.ev[draggable="true"] { cursor: grab; }
.ev.tg { border-left-color: var(--tg); background: var(--tg-tint); }
.ev.x { border-left-color: var(--xk); background: var(--x-tint); }
.ev.li { border-left-color: var(--li); background: var(--li-tint); }
.ev .t { font-weight: 700; }
.ev .ctrl { display: flex; gap: 4px; margin-top: 4px; }
.ev .ctrl button, .ev .ctrl a { min-width: 28px; min-height: 26px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-size: 12px; text-decoration: none; color: var(--ink); display: grid; place-items: center; padding: 0 6px; }

/* Inspiration */
.creator { display: flex; flex-direction: column; gap: 12px; }
.cav { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-family: var(--display); color: #FFFFFF; flex-shrink: 0; }
.matrix-scroll { overflow-x: auto; }
table.matrix { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13px; }
.matrix th, .matrix td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: center; }
.matrix th:first-child, .matrix td:first-child { text-align: left; font-weight: 650; }
.matrix thead th { font-size: 12px; color: var(--muted); }
.str { letter-spacing: 2px; color: var(--accent); font-weight: 800; }
.str .off { color: var(--line-2); }
.matrix tr.hl td { background: var(--accent-tint); }

/* Phone (Telegram bot) */
.phone { width: min(360px, 100%); margin-inline: auto; border-radius: 34px; padding: 12px; background: #0E1320; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.phone-in { border-radius: 24px; overflow: hidden; background: #E6EBEE; display: flex; flex-direction: column; height: 560px; }
.tg-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #2B5278; color: #FFFFFF; }
.tg-av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #3355FF, #F2A33A); }
.tg-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #C9D7DE; }
.tg-msg { max-width: 85%; padding: 8px 11px; border-radius: 12px; font-size: 13.5px; line-height: 1.45; white-space: pre-line; color: #0F1422; overflow-wrap: anywhere; }
.tg-msg.bot { align-self: flex-start; background: #FFFFFF; border-bottom-left-radius: 4px; }
.tg-msg.me { align-self: flex-end; background: #E2FFC7; border-bottom-right-radius: 4px; }
.tg-msg .time { display: block; text-align: right; font-size: 10.5px; color: #5E6B78; margin-top: 2px; }
.tg-foot { display: flex; gap: 8px; padding: 8px; background: #FFFFFF; }
.tg-foot input { min-height: 38px; border-radius: 19px; border: 1px solid #C9D2DA; background: #FFFFFF; color: #0F1422; }
.tg-foot button { min-width: 38px; min-height: 38px; border-radius: 50%; border: 0; background: #2B88D8; color: #FFFFFF; cursor: pointer; font-weight: 700; }

/* Profile */
.profile-hero { position: relative; overflow: hidden; padding: 0; }
.profile-cover { height: 110px; }
.profile-body { padding: 0 22px 22px; display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; margin-top: -42px; }
.big-av { width: 92px; height: 92px; border-radius: 50%; border: 4px solid var(--panel); background: linear-gradient(135deg, var(--accent), var(--amber)); color: #FFFFFF; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 32px; }
.kv { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr); gap: 8px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }

/* How it works */
.lane { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.step { flex: 1 1 130px; min-width: 0; display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 12px; border-radius: 12px; border: 2px solid var(--line-2); background: var(--panel); cursor: pointer; }
.step.F { border-color: var(--accent); background: var(--accent-tint); }
.step.N { border-color: var(--amber); background: var(--amber-tint); }
.step.B { border-color: var(--ink); }
.step[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
.step .n { font-size: 11px; font-weight: 700; color: var(--muted); }
.step .t { font-weight: 750; font-size: 15px; }
.step .o { font-size: 11.5px; font-weight: 700; margin-top: auto; color: var(--ink-2); }
.arrow { align-self: center; color: var(--muted); }
@media (max-width: 760px) { .arrow { display: none; } }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; max-width: min(560px, calc(100% - 32px)); background: var(--ink); color: var(--panel); padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: 0 14px 34px rgba(0,0,0,.28); }
.empty { text-align: center; padding: 34px 18px; color: var(--muted); }
</style>
</head>
