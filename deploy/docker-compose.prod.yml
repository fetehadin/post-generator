# Production on the Contabo VPS. Run from the repo root (deploy/deploy.sh does this):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# The settings file lives on the server only; its template is deploy/server-env.template.
name: voxlace

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Caddy.Dockerfile
      args:
        VITE_SUPABASE_URL: ${AUTH_PUBLIC_URL:-${SUPABASE_URL}}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      FRONTEND_URL: https://${DOMAIN}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-voxlace_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-voxlace}
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-voxlace}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-voxlace}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      GENERATION_MODELS: ${GENERATION_MODELS:-google:gemini-flash-latest,google:gemini-flash-lite-latest,groq:openai/gpt-oss-120b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DAILY_DRAFT_LIMIT: ${DAILY_DRAFT_LIMIT:-40}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      INVITE_ONLY: ${INVITE_ONLY:-false}
      GUEST_SIGNING_KEY: ${GUEST_SIGNING_KEY:-}
      GUEST_DAILY_DRAFTS: ${GUEST_DAILY_DRAFTS:-12}
      GUEST_DAILY_TOTAL: ${GUEST_DAILY_TOTAL:-300}
      EDGE_SECRET: ${EDGE_SECRET:-}
      GENERATION_MODELS_LIGHT: ${GENERATION_MODELS_LIGHT:-}
      # FR-48: encrypts users' own AI keys; empty turns the AI keys tab off.
      AI_KEY_ENCRYPTION_KEYS: ${AI_KEY_ENCRYPTION_KEYS:-}
      # FR-14: GitHub → daily dev drafts; empty turns it off. The private key is one line with \n.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Telegram bot (FR-36): all three, or the bot stays off.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxlace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-voxlace}
      APP_DB_USER: ${APP_DB_USER:-voxlace_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    # No ports: the database is never reachable from the internet (NFR-18).
    volumes:
      - pgdata:/var/lib/postgresql
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  caddy_data:
  caddy_config:
