name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which parts of the repo exist yet, so CI stays green before Phase 0 code lands.
  detect:
    name: Detect project parts
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.parts.outputs.backend }}
      frontend: ${{ steps.parts.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: parts
        run: |
          echo "backend=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (lint, migrate, test)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: voxlace
          POSTGRES_PASSWORD: voxlace
          POSTGRES_DB: voxlace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxlace -d voxlace_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://voxlace:voxlace@localhost:5432/voxlace_test
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Enable pgvector
        run: PGPASSWORD=voxlace psql -h localhost -U voxlace -d voxlace_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Migrations apply cleanly
        if: hashFiles('backend/alembic.ini') != ''
        run: alembic upgrade head
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (lint, test, build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build (type-checks too)
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One stable check name to require in branch protection, whatever parts exist.
  ci-passed:
    name: CI passed
    if: always()
    needs: [detect, backend, frontend, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded or were skipped
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          if echo "$results" | grep -Eq '"(failure|cancelled)"'; then exit 1; fi
