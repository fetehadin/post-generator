name: Uptime

# Every 30 minutes: does the live app answer? GitHub emails the repo owner when a scheduled run
# fails, so a down server or a dead database shows up without anyone watching (BUILD_PLAN Phase 6).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health:
    name: Health check
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - name: GET /api/v1/health
        run: |
          # Three tries, so one slow answer during a deploy isn't an alarm.
          for i in 1 2 3; do
            if curl -fsS --max-time 20 "https://$DOMAIN/api/v1/health"; then exit 0; fi
            sleep 20
          done
          echo "https://$DOMAIN is down or its database is" >&2
          exit 1
